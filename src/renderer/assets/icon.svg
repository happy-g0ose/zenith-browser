<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4" />

  <!-- Outer Glow Ring -->
  <path d="M 256 70 C 370 70 410 110 410 230 C 410 350 256 442 256 442 C 256 442 102 350 102 230 C 102 110 142 70 256 70 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="4" opacity="0.4" filter="url(#glow)" />

  <!-- Main Shield Body -->
  <path d="M 256 86 C 360 86 394 122 394 232 C 394 340 256 424 256 424 C 256 424 118 340 118 232 C 118 122 152 86 256 86 Z"
        fill="url(#shieldGrad)" stroke="rgba(256, 256, 256, 0.2)" stroke-width="2" />

  <!-- Inner Dark Geometric Shield -->
  <path d="M 256 112 C 336 112 364 142 364 232 C 364 320 256 390 256 390 C 256 390 148 320 148 232 C 148 142 176 112 256 112 Z"
        fill="#0d0f1a" />

  <!-- Minimalist Geometric Fox Motif -->
  <!-- Fox Left Ear -->
  <path d="M 256 220 L 190 160 L 210 230 Z" fill="url(#shieldGrad)" />
  <!-- Fox Right Ear -->
  <path d="M 256 220 L 322 160 L 302 230 Z" fill="url(#shieldGrad)" />

  <!-- Fox Left Cheek -->
  <path d="M 256 260 L 175 220 L 210 300 Z" fill="url(#shieldGrad)" />
  <!-- Fox Right Cheek -->
  <path d="M 256 260 L 337 220 L 302 300 Z" fill="url(#shieldGrad)" />

  <!-- Fox Center Muzzle & Glow Core -->
  <path d="M 256 180 L 290 260 L 256 330 L 222 260 Z" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Sleek Eyes -->
  <polygon points="214,242 242,252 226,256" fill="#ffffff" />
  <polygon points="298,242 270,252 286,256" fill="#ffffff" />

  <!-- Core Diamond Spark -->
  <circle cx="256" cy="260" r="4" fill="#ffffff" />
</svg>
