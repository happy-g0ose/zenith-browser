<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/themes.css">
  <style>
    html, body { background: transparent !important; overflow: hidden; }
    body { padding: 0; }

    .popup-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: var(--bg-secondary, #161b22);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      width: 100%;
      height: 100vh;
      animation: popupIn 0.18s var(--ease-spring, cubic-bezier(.34,1.15,.64,1));
      transform-origin: top right;
    }
    @keyframes popupIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .popup-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .popup-title-group { display: flex; align-items: center; gap: 6px; }
    .popup-title { font-size: 13px; font-weight: 600; color: var(--text-bright); }
    .badge-status { font-size: 10.5px; padding: 2px 8px; border-radius: 20px; background: var(--green-muted, rgba(62,207,142,.12)); color: var(--green, #3ecf8e); font-weight: 600; }
    .icon-green { color: var(--green, #3ecf8e); }

    .popup-content { display: flex; flex-direction: column; gap: 8px; }
    .popup-stat-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .stat-label { color: var(--text-muted); }
    .stat-value { color: var(--text); font-weight: 500; }
    .text-green { color: var(--green, #3ecf8e); }

    .popup-footer { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
    .popup-btn {
      flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-tertiary, #1c2128); color: var(--text); font-size: 11.5px;
      cursor: pointer; transition: background .15s var(--ease-smooth), border-color .15s var(--ease-smooth);
    }
    .popup-btn:hover { background: #232a35; border-color: var(--accent); }

    .menu-profile-card {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px; border-radius: 8px; background: var(--bg-tertiary, #1c2128);
      border: 1px solid var(--border);
    }
    .profile-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .profile-dot-large { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
    .profile-texts { display: flex; flex-direction: column; min-width: 0; }
    .profile-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
    .profile-name { font-size: 12.5px; color: var(--text-bright); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-sub-btn {
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--accent); font-size: 11.5px; cursor: pointer; flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .menu-sub-btn:hover { background: var(--accent-muted); }

    .menu-divider { height: 1px; background: var(--border); margin: 2px 0; }

    .menu-items-list { display: flex; flex-direction: column; gap: 2px; }
    .menu-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px;
      color: var(--text); font-size: 12.5px; cursor: pointer; border: none; background: none; text-align: left;
      transition: background .14s var(--ease-smooth), transform .14s var(--ease-smooth);
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.06); transform: translateX(2px); }
    .menu-item svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; color: var(--text-muted); }
    .menu-item:hover svg { color: var(--accent); }
    .menu-shortcut { margin-left: auto; font-size: 10.5px; color: var(--text-dim, #484f58); }

    .menu-theme-row { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
    .menu-subhead { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 8px; }
    .theme-bubbles { display: flex; gap: 8px; }
    .theme-bubble {
      width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1px solid #333;
      transition: transform .14s var(--ease-smooth), box-shadow .14s var(--ease-smooth);
    }
    .theme-bubble:hover { transform: scale(1.18); }
    .theme-bubble.active { box-shadow: 0 0 0 2px var(--accent); }

    /* Command palette */
    .palette-input-wrapper {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-tertiary, #1c2128); border: 1px solid var(--border-focus, rgba(91,141,239,.5));
      border-radius: 8px; padding: 9px 12px;
    }
    .palette-input-wrapper svg { width: 15px; height: 15px; fill: none; stroke: var(--text-muted); stroke-width: 2; flex-shrink: 0; }
    .palette-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text-bright); font-size: 13.5px; font-family: inherit;
    }
    .palette-results { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; margin-top: 4px; }
    .palette-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px;
      border: none; background: none; color: var(--text); font-size: 12.5px; text-align: left; cursor: pointer;
      transition: background .12s var(--ease-smooth, ease);
    }
    .palette-item:hover, .palette-item.selected { background: rgba(91, 141, 239, 0.14); }
    .palette-item .p-key { margin-left: auto; font-size: 10.5px; color: var(--text-dim, #484f58); }
    .palette-empty { color: var(--text-dim, #484f58); font-size: 12px; text-align: center; padding: 18px 0; }

    /* Extensions list (Opera-style) */
    .ext-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 8px;
      transition: background .12s var(--ease-smooth, ease);
    }
    .ext-row:hover { background: rgba(255, 255, 255, 0.05); }
    .ext-ico {
      width: 30px; height: 30px; border-radius: 7px; background: rgba(255,255,255,.06);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
    }
    .ext-ico img { width: 20px; height: 20px; object-fit: contain; }
    .ext-nm { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-bright, #e6edf3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ext-row.off .ext-nm { opacity: .5; text-decoration: line-through; }
    .switch { position: relative; width: 32px; height: 18px; flex-shrink: 0; cursor: pointer; }
    .switch input { display: none; }
    .switch .track { position: absolute; inset: 0; border-radius: 18px; background: #2a3140; transition: background .15s; }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #8b949e; transition: transform .15s, background .15s; }
    .switch input:checked ~ .track { background: rgba(91,141,239,.45); }
    .switch input:checked ~ .knob { transform: translateX(14px); background: var(--accent, #5b8def); }
    .ext-footer {
      margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border, rgba(255,255,255,.08));
    }
    .ext-manage {
      width: 100%; padding: 8px 12px; border-radius: 7px; border: 1px solid var(--border, rgba(255,255,255,.08));
      background: var(--bg-tertiary, #1c2128); color: var(--text); font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .14s, border-color .14s;
    }
    .ext-manage:hover { border-color: var(--accent, #5b8def); }
    .ext-empty { color: var(--text-muted, #8b949e); font-size: 12px; text-align: center; padding: 24px 8px; }
    .bm-chip {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 5px; color: #fff; font-size: 9.5px; font-weight: 700; flex-shrink: 0;
    }
    .form-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted, #8b949e); margin-bottom: 6px; }
    .form-input {
      width: 100%; background: var(--bg-primary, #0b0d11); border: 1px solid var(--border, rgba(255,255,255,.08));
      border-radius: 7px; color: var(--text-bright, #e6edf3); font-size: 12.5px;
      padding: 8px 10px; outline: none; margin-bottom: 7px; font-family: inherit;
    }
    .form-input:focus { border-color: var(--accent, #5b8def); }
    select.form-input { cursor: pointer; }

    /* Downloads */
    .dl-row { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.03); }
    .dl-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dl-name { font-size: 12px; color: var(--text-bright, #e6edf3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dl-size { font-size: 10.5px; color: var(--text-muted, #8b949e); flex-shrink: 0; }
    .dl-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
    .dl-fill { height: 100%; background: var(--accent, #5b8def); border-radius: 3px; transition: width .3s var(--ease-smooth, ease); }
    .dl-fill.done { background: var(--green, #3ecf8e); }
    .dl-btns { display: flex; gap: 6px; }
    .dl-btns .ext-manage { padding: 5px 10px; font-size: 11px; width: auto; }
  </style>
</head>
<body>
  <div class="popup-panel" id="panel"></div>
  <script src="../assets/engine-icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
