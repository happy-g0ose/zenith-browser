<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        :root {
            --base-bg: #0b0d11;
            --accent: #5b8def;
            --status: #3ecf8e;
            --text-main: #c9d1d9;
            --text-dim: #6e7681;
            --border: rgba(110, 118, 129, 0.2);
            --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--base-bg);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle CSS noise texture */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        .clock {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: -0.05em;
            margin-bottom: 2.5rem;
            color: var(--text-main);
        }

        .search-wrapper {
            width: 100%;
            position: relative;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            width: 16px;
            height: 16px;
            fill: var(--text-dim);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 16px 12px 42px;
            font-size: 1rem;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin-bottom: 2rem;
        }

        .links-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4rem;
        }

        .link-item {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .link-item:hover {
            color: var(--text-main);
        }

        .link-item:not(:last-child)::after {
            content: '';
            display: inline-block;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background-color: var(--text-dim);
            margin-left: 12px;
            opacity: 0.5;
        }

        .shield-status {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--status);
            box-shadow: 0 0 8px var(--status);
        }

        .status-text span {
            color: var(--text-dim);
        }
        
        .status-text span.dot-sep::before {
            content: '·';
            margin: 0 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="clock" id="clock">00:00</div>

    <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C8.68629 2 6 4.68629 6 8V10H5C3.89543 10 3 10.8954 3 12V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V12C21 10.8954 20.1046 10 19 10H18V8C18 4.68629 15.3137 2 12 2ZM8 10V8C8 5.79086 9.79086 4 12 4C14.2091 4 16 5.79086 16 8V10H8ZM5 12H19V20H5V12ZM12 14.5C11.1716 14.5 10.5 15.1716 10.5 16C10.5 16.8284 11.1716 17.5 12 17.5C12.8284 17.5 13.5 16.8284 13.5 16C13.5 15.1716 12.8284 14.5 12 14.5Z" />
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search DuckDuckGo or enter address..." autocomplete="off" autofocus>
    </div>

    <div class="divider"></div>

    <div class="links-row">
        <a href="about:fingerprint" class="link-item">Аудит отпечатков</a>
        <a href="about:profiles" class="link-item">Профили</a>
        <a href="about:customizer" class="link-item">Кастомизация (CSS)</a>
        <a href="about:config" class="link-item">Настройки</a>
        <a href="https://duckduckgo.com" class="link-item">DuckDuckGo</a>
        <a href="https://ipleak.net" class="link-item">IPLeak</a>
    </div>
</div>

<div class="shield-status">
    <div class="status-dot"></div>
    <div class="status-text">
        Shield active <span class="dot-sep">0 blocked</span> <span class="dot-sep">Canvas noise seeded</span> <span class="dot-sep">WebRTC protected</span>
    </div>
</div>

<script src="newtab.js"></script>
</body>
</html>
