<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Mask for breaking the circle where the diagonal ray cuts through -->
    <mask id="zenith-cut">
      <rect width="100" height="100" fill="white" />
      <!-- Gap near bottom-left -->
      <circle cx="27" cy="73" r="6" fill="black" />
      <!-- Gap near top-right -->
      <circle cx="73" cy="27" r="6" fill="black" />
    </mask>
  </defs>

  <g stroke="#5b8def" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Main Circular Dial with gaps -->
    <circle cx="50" cy="50" r="32" mask="url(#zenith-cut)" />

    <!-- 12 Radial Ticks along circumference -->
    <!-- 0 deg / Top -->
    <line x1="50" y1="18" x2="50" y2="12" />
    <!-- 30 deg -->
    <line x1="66" y1="22.3" x2="69" y2="17.1" />
    <!-- 60 deg -->
    <line x1="77.7" y1="34" x2="82.9" y2="31" />
    <!-- 90 deg / Right -->
    <line x1="82" y1="50" x2="88" y2="50" />
    <!-- 120 deg -->
    <line x1="77.7" y1="66" x2="82.9" y2="69" />
    <!-- 150 deg -->
    <line x1="66" y1="77.7" x2="69" y2="82.9" />
    <!-- 180 deg / Bottom -->
    <line x1="50" y1="82" x2="50" y2="88" />
    <!-- 210 deg -->
    <line x1="34" y1="77.7" x2="31" y2="82.9" />
    <!-- 240 deg -->
    <line x1="22.3" y1="66" x2="17.1" y2="69" />
    <!-- 270 deg / Left -->
    <line x1="18" y1="50" x2="12" y2="50" />
    <!-- 300 deg -->
    <line x1="22.3" y1="34" x2="17.1" y2="31" />
    <!-- 330 deg -->
    <line x1="34" y1="22.3" x2="31" y2="17.1" />

    <!-- Sharp Diagonal Ray cutting through center -->
    <line x1="16" y1="84" x2="84" y2="16" stroke="#5b8def" stroke-width="3" />
  </g>
</svg>
